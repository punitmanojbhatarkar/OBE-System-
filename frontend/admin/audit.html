<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Audit Logs</title>
    <link rel="stylesheet" href="../styles/globals.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { padding: 40px; background: #f9fafb; font-family: 'Inter', sans-serif; }
        .audit-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .audit-table th, .audit-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        .audit-table th { background: #f3f4f6; font-weight: 600; color: #374151; }
        .audit-table td { color: #4b5563; font-size: 14px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .badge { background: #e0e7ff; color: #4f46e5; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .back-btn { padding: 8px 16px; background: #4f46e5; color: white; border-radius: 6px; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="header">
        <h1>System Audit Logs</h1>
        <a href="dashboard.html" class="back-btn">Back to Dashboard</a>
    </div>
    
    <table class="audit-table">
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>User ID</th>
                <th>Action</th>
                <th>Details</th>
            </tr>
        </thead>
        <tbody id="audit-body">
            <tr><td colspan="4" style="text-align:center;">Loading logs...</td></tr>
        </tbody>
    </table>

    <script src="../scripts/auth.js"></script>
    <script src="../scripts/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.requireAuth(['admin', 'hod'])) return;
            
            try {
                const logs = await window.apiFetch('/api/audit-logs');
                const tbody = document.getElementById('audit-body');
                tbody.innerHTML = '';
                
                if (logs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No audit logs found.</td></tr>';
                    return;
                }
                
                logs.forEach(log => {
                    const date = new Date(log.timestamp).toLocaleString();
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${date}</td>
                        <td><code>${log.user_id}</code></td>
                        <td><span class="badge">${log.action}</span></td>
                        <td>${log.details}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('audit-body').innerHTML = '<tr><td colspan="4" style="text-align:center;color:red;">Failed to load logs.</td></tr>';
            }
        });
    </script>
</body>
</html>
