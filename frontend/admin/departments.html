<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Departments Management | OBE System – MITAOE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../styles/components.css">
  <style>
    .dept-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px;
    }
    .dept-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-md); overflow: hidden; display: flex; flex-direction: column;
    }
    .dept-card:hover { border-color: var(--primary); }
    .dept-card-header {
      padding: 16px; border-bottom: 1px solid var(--border); display: flex;
      justify-content: space-between; align-items: center; background: var(--surface-2);
    }
    .dept-card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 12px; }
  </style>
</head>
<body>
<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">OBE</div>
      <div><div class="logo-text">OBE System</div><div class="logo-sub">MITAOE</div></div>
    </div>
    <nav class="sidebar-nav">
      <p class="nav-section-label">Institutional Management</p>
      <a class="nav-item" href="dashboard.html"><span class="nav-icon" data-icon="dashboard"></span><span>Admin Dashboard</span></a>
      <a class="nav-item active" href="departments.html"><span class="nav-icon" data-icon="matrix"></span><span>Departments</span></a>
      <a class="nav-item" href="patterns.html"><span class="nav-icon" data-icon="document"></span><span>Curriculum Patterns</span></a>
      <a class="nav-item" href="users.html"><span class="nav-icon" data-icon="students"></span><span>User Directory</span></a>
      <a class="nav-item" href="config.html"><span class="nav-icon" data-icon="config"></span><span>System Settings</span></a>
      <a class="nav-item" href="audit.html"><span class="nav-icon" data-icon="audit"></span><span>Audit Trail</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card" onclick="Auth.logout()">
        <div class="user-avatar"></div>
        <div><div class="user-name"></div><div class="user-role"></div></div>
      </div>
      <button class="btn btn-secondary btn-sm w-full" data-action="logout" style="margin-top:8px; width:100%;">
        <span data-icon="logout"></span><span>Sign Out</span>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="topbar-title">Academic Departments Directory</h1>
        <div class="topbar-breadcrumb">Admin Console <span>›</span> Engineering Departments</div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary btn-sm" onclick="openAddDeptModal()">
          <span data-icon="plus"></span><span>Add Department</span>
        </button>
      </div>
    </header>

    <div class="page-content">

      <!-- Department Cards Grid -->
      <div id="deptGrid" class="dept-grid"></div>

    </div>
  </main>
</div>

<script src="../scripts/icons.js"></script>
<script src="../scripts/data.js"></script>
<script src="../scripts/api.js"></script>
<script src="../scripts/auth.js"></script>
<script src="../scripts/utils.js"></script>
<script>
(async () => {
  await (window._apiReady || Promise.resolve());
  const user = Auth.requireAuth(['admin']);
  if (!user) throw new Error('Not authorized');

  renderDepts();
  renderAllIcons();

  function renderDepts() {
    const grid = document.getElementById('deptGrid');
    const depts = DB.departments.all();
    const users = DB.users.all();
    const courses = DB.courses.all();

    grid.innerHTML = depts.map(d => {
      const hod = users.find(u => u.id === d.hodId);
      const fCount = users.filter(u => u.deptId === d.id && (u.role === 'faculty' || u.role === 'hod')).length;
      const cCount = courses.filter(c => c.deptId === d.id).length;

      return `
        <div class="dept-card">
          <div class="dept-card-header">
            <div>
              <span class="badge badge-primary font-mono" style="font-size:12px;">${d.code}</span>
            </div>
            <div style="font-size:12px;color:var(--text-secondary);font-weight:600;">${cCount} Courses</div>
          </div>
          <div class="dept-card-body">
            <h3 style="font-size:16px;font-weight:700;color:var(--text-primary);margin:0;">${d.name}</h3>
            <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px;">
              <div style="font-size:11px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;margin-bottom:2px;">Head of Department</div>
              <div style="font-weight:600;color:var(--text-primary);">${hod ? hod.name : 'Not Assigned'}</div>
            </div>
            <div style="display:flex;gap:8px;">
              <span class="badge badge-neutral">${fCount} Faculty Members</span>
              <span class="badge badge-success">Accredited</span>
            </div>
          </div>
          <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;">
            <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="openEditDeptModal('${d.id}')">
              <span data-icon="edit"></span><span>Edit</span>
            </button>
            <button class="btn btn-danger btn-sm btn-icon" onclick="deleteDept('${d.id}')">
              <span data-icon="trash"></span>
            </button>
          </div>
        </div>
      `;
    }).join('');
    renderAllIcons(grid);
  }

  function openAddDeptModal() {
    const users = DB.users.all().filter(u => u.role === 'hod' || u.role === 'faculty');
    const hodOptions = users.map(u => `<option value="${u.id}">${u.name} (${u.email})</option>`).join('');

    const html = `
      <div class="modal-header">
        <h3 class="modal-title">Add Academic Department</h3>
        <button class="btn btn-secondary btn-sm btn-icon" onclick="Modal.close()"><span data-icon="close"></span></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Department Code *</label>
          <input class="form-input" id="d-code" placeholder="e.g. COMP, MECH, ENTC">
        </div>
        <div class="form-group">
          <label class="form-label">Department Full Name *</label>
          <input class="form-input" id="d-name" placeholder="e.g. Computer Engineering">
        </div>
        <div class="form-group">
          <label class="form-label">Assigned Head of Department</label>
          <select class="form-select" id="d-hod">
            <option value="">-- None --</option>
            ${hodOptions}
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="Modal.close()">Cancel</button>
        <button class="btn btn-primary" onclick="saveDept()">Create Department</button>
      </div>
    `;
    Modal.open(html);
    renderAllIcons();
  }

  function openEditDeptModal(id) {
    const d = DB.departments.byId(id);
    if (!d) return;
    const users = DB.users.all().filter(u => u.role === 'hod' || u.role === 'faculty');
    const hodOptions = users.map(u => `<option value="${u.id}" ${u.id===d.hodId?'selected':''}>${u.name} (${u.email})</option>`).join('');

    const html = `
      <div class="modal-header">
        <h3 class="modal-title">Edit Department</h3>
        <button class="btn btn-secondary btn-sm btn-icon" onclick="Modal.close()"><span data-icon="close"></span></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Department Code *</label>
          <input class="form-input" id="d-code" value="${d.code}">
        </div>
        <div class="form-group">
          <label class="form-label">Department Full Name *</label>
          <input class="form-input" id="d-name" value="${d.name}">
        </div>
        <div class="form-group">
          <label class="form-label">Assigned Head of Department</label>
          <select class="form-select" id="d-hod">
            <option value="">-- None --</option>
            ${hodOptions}
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="Modal.close()">Cancel</button>
        <button class="btn btn-primary" onclick="saveDept('${d.id}')">Save Changes</button>
      </div>
    `;
    Modal.open(html);
    renderAllIcons();
  }

  function saveDept(id) {
    const code = document.getElementById('d-code').value.trim();
    const name = document.getElementById('d-name').value.trim();
    const hodId = document.getElementById('d-hod').value || null;

    if (!code || !name) { Toast.error('Code and Name are required.'); return; }

    if (id) {
      DB.departments.update({ id, code, name, hodId });
      Toast.success('Department updated.');
    } else {
      DB.departments.add({ code, name, hodId });
      Toast.success('Department added.');
    }
    Modal.close();
    renderDepts();
  }

  function deleteDept(id) {
    const d = DB.departments.byId(id);
    if (!d) return;
    Modal.confirm('Delete Department', `Remove department ${d.name} (${d.code})?`, () => {
      DB.departments.delete(id);
      renderDepts();
      Toast.success('Department removed.');
    }, 'Delete', true);
  }

  window.openAddDeptModal = openAddDeptModal;
  window.openEditDeptModal = openEditDeptModal;
  window.saveDept = saveDept;
  window.deleteDept = deleteDept;
})();
</script>
</body>
</html>
