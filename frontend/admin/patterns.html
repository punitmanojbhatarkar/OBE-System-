<!DOCTYPE html>
<html lang="en">
<head>

    }
    .pattern-card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 12px; }

</head>

<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">

    </div>
    <nav class="sidebar-nav">

      <a class="nav-item" href="dashboard.html"><span class="nav-icon" data-icon="dashboard"></span><span>Admin Dashboard</span></a>

        <div><div class="user-name"></div><div class="user-role"></div></div>
      </div>
      <button class="btn btn-secondary btn-sm w-full" data-action="logout" style="margin-top:8px; width:100%;">
        <span data-icon="logout"></span><span>Sign Out</span>

<script src="../scripts/data.js"></script>

<script>
(async () => {
  await (window._apiReady || Promise.resolve());
  const user = Auth.requireAuth(['admin']);
  if (!user) throw new Error('Not authorized');

  renderPatterns();
  renderAllIcons();

  function renderPatterns() {
    const grid = document.getElementById('patternGrid');
    const patterns = DB.patterns.all();
    const depts = DB.departments.all();
    const outcomes = DB.outcomes.all();

    if (patterns.length === 0) {
      grid.innerHTML = '<div style="grid-column: 1/-1; padding: 40px; text-align: center; color: var(--text-secondary); background: var(--surface-2); border-radius: var(--r-md);">No curriculum patterns found. Create one to define POs and PSOs.</div>';
      return;
    }

    grid.innerHTML = patterns.map(p => {
      const dept = depts.find(d => d.id === p.departmentId);
      const pOutcomes = outcomes.filter(o => o.patternId === p.id);
      const pos = pOutcomes.filter(o => o.type === 'PO').length;
      const psos = pOutcomes.filter(o => o.type === 'PSO').length;

      return `
        <div class="pattern-card">
          <div class="pattern-card-header">
            <div>
              <span class="badge badge-primary font-mono" style="font-size:12px;">${p.year}</span>
            </div>
            <div style="font-size:12px;color:var(--text-secondary);font-weight:600;">${pos} POs, ${psos} PSOs</div>
          </div>
          <div class="pattern-card-body">
            <h3 style="font-size:16px;font-weight:700;color:var(--text-primary);margin:0;">${p.name}</h3>
            <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px;">
              <div style="font-size:11px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;margin-bottom:2px;">Department</div>
              <div style="font-weight:600;color:var(--text-primary);">${dept ? dept.name : 'All Departments'}</div>
            </div>
          </div>
          <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;">
            <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="openManageOutcomesModal('${p.id}')">
              <span data-icon="matrix"></span><span>Manage Outcomes</span>
            </button>
          </div>
        </div>
      `;
    }).join('');
    renderAllIcons(grid);
  }

    { code: 'PO4', description: 'Conduct Investigations of Complex Problems: Use research-based knowledge and research methods including design of experiments, analysis and interpretation of data, and synthesis of the information to provide valid conclusions.' },

    { code: 'PO6', description: 'The Engineer and Society: Apply reasoning informed by the contextual knowledge to assess societal, health, safety, legal and cultural issues and the consequent responsibilities relevant to the professional engineering practice.' },
    { code: 'PO7', description: 'Environment and Sustainability: Understand the impact of the professional engineering solutions in societal and environmental contexts, and demonstrate the knowledge of, and need for sustainable development.' },
    { code: 'PO8', description: 'Ethics: Apply ethical principles and commit to professional ethics and responsibilities and norms of the engineering practice.' },
    { code: 'PO9', description: 'Individual and Team Work: Function effectively as an individual, and as a member or leader in diverse teams, and in multidisciplinary settings.' },
    { code: 'PO10', description: 'Communication: Communicate effectively on complex engineering activities with the engineering community and with society at large, such as, being able to comprehend and write effective reports and design documentation, make effective presentations, and give and receive clear instructions.' },
    { code: 'PO11', description: 'Project Management and Finance: Demonstrate knowledge and understanding of the engineering and management principles and apply these to one’s own work, as a member and leader in a team, to manage projects and in multidisciplinary environments.' },
    { code: 'PO12', description: 'Life-Long Learning: Recognize the need for, and have the preparation and ability to engage in independent and life-long learning in the broadest context of technological change.' }
  ];

  const INSTITUTION_PRESETS = {

      university: 'Savitribai Phule Pune University (SPPU)',
      status: 'Autonomous Engineering Institute (UGC Autonomous / NBA Accredited)',
      latestPatternName: '2024 NEP Pattern (MITAOE Autonomous)',

        { code: 'PSO2', description: 'Modern Systems Design: Design, test, and deploy modern software, network architectures, and data-driven systems meeting industry standards.' }
      ]
    },
    coep: {
      college: 'COEP Technological University (COEP Tech), Pune',
      university: 'COEP Technological University',
      status: 'Unitary State Public University',
      latestPatternName: '2024 NEP Autonomous Curriculum',
      latestYear: '2024',
      legacyPatternName: '2020 Autonomous Pattern',
      legacyYear: '2020',
      desc: 'Autonomous curriculum aligned with Washington Accord Tier-I NBA accreditation criteria.',
      pos11: NBA_GAPC_11_POS,
      pos12: NBA_LEGACY_12_POS,
      psos: [
        { code: 'PSO1', description: 'Technical Specialization: Demonstrate technical competency in domain-specific problem formulation and system implementation.' },
        { code: 'PSO2', description: 'System Design & Research: Exhibit proficiency in modern engineering design, research methodologies, and collaborative projects.' }
      ]
    },
    vit: {
      college: 'Vishwakarma Institute of Technology (VIT Pune)',
      university: 'Savitribai Phule Pune University (Autonomous)',
      status: 'Autonomous Institute under SPPU',
      latestPatternName: '2024 Module Curriculum (NEP)',
      latestYear: '2024',
      legacyPatternName: '2021 Module Pattern',
      legacyYear: '2021',
      desc: 'Project-centric learning curriculum adhering to standard NBA Graduate Attributes.',
      pos11: NBA_GAPC_11_POS,
      pos12: NBA_LEGACY_12_POS,
      psos: [
        { code: 'PSO1', description: 'Software Architecture: Formulate scalable software and system designs using contemporary design patterns.' },
        { code: 'PSO2', description: 'Applied Engineering: Build robust prototypes solving complex real-world engineering challenges.' }
      ]
    },
    nba_aicte: {
      college: 'Universal AICTE / NBA Washington Accord Framework',
      university: 'National Board of Accreditation (NBA)',
      status: 'National Accreditation Standard (Tier-I & Tier-II)',
      latestPatternName: 'NBA GAPC v4.0 Standard Pattern',
      latestYear: '2024',
      legacyPatternName: 'NBA Traditional 12-PO Scheme',
      legacyYear: '2019',
      desc: 'Standard Program Outcomes recognized across all NBA accredited engineering programs nationwide.',
      pos11: NBA_GAPC_11_POS,
      pos12: NBA_LEGACY_12_POS,
      psos: [
        { code: 'PSO1', description: 'Domain Competency: Formulate and implement domain-specific engineering solutions.' },
        { code: 'PSO2', description: 'Professional Readiness: Demonstrate engineering design, testing, and modern tool competency.' }
      ]
    },
    custom: {
      college: 'Custom / Other Institution',
      university: 'Autonomous / Affiliated University',
      status: 'Custom Curriculum Pattern',
      latestPatternName: '2024 Curriculum Pattern',
      latestYear: '2024',
      legacyPatternName: 'Curriculum Pattern',
      legacyYear: '2019',
      desc: 'Custom institution curriculum pattern with editable outcomes.',
      pos11: NBA_GAPC_11_POS,
      pos12: NBA_LEGACY_12_POS,
      psos: []
    }
  };

  function onCollegePresetChange(key) {
    const preset = INSTITUTION_PRESETS[key] || INSTITUTION_PRESETS.mitaoe;
    const framework = document.getElementById('p-framework') ? document.getElementById('p-framework').value : 'nep2024';
    const nameEl = document.getElementById('p-name');
    const yearEl = document.getElementById('p-year');
    const univNameEl = document.getElementById('p-univ-name');
    const univStatusEl = document.getElementById('p-univ-status');
    const univDescEl = document.getElementById('p-univ-desc');

    if (nameEl) nameEl.value = (framework === 'nep2024') ? preset.latestPatternName : preset.legacyPatternName;
    if (yearEl) yearEl.value = (framework === 'nep2024') ? preset.latestYear : preset.legacyYear;
    if (univNameEl) univNameEl.textContent = preset.university;
    if (univStatusEl) univStatusEl.textContent = preset.status;
    if (univDescEl) univDescEl.textContent = preset.desc;
  }

  function onFrameworkChange(framework) {
    const college = document.getElementById('p-college') ? document.getElementById('p-college').value : 'mitaoe';
    const preset = INSTITUTION_PRESETS[college] || INSTITUTION_PRESETS.mitaoe;
    const nameEl = document.getElementById('p-name');
    const yearEl = document.getElementById('p-year');
    const autoLabel = document.getElementById('p-autoload-label');

    if (framework === 'nep2024') {
      if (nameEl) nameEl.value = preset.latestPatternName;
      if (yearEl) yearEl.value = preset.latestYear;
      if (autoLabel) autoLabel.textContent = 'Auto-load 11 Official NBA GAPC v4.0 Outcomes (PO1 to PO11) + PSOs';
    } else {
      if (nameEl) nameEl.value = preset.legacyPatternName;
      if (yearEl) yearEl.value = preset.legacyYear;
      if (autoLabel) autoLabel.textContent = 'Auto-load 12 Traditional NBA/SPPU Outcomes (PO1 to PO12) + PSOs';
    }
  }

  function openAddPatternModal() {
    const depts = DB.departments.all();
    const deptOptions = depts.map(d => `<option value="${d.id}">${d.name}</option>`).join('');

    const html = `
      <div class="modal-header">
        <h3 class="modal-title">Add Curriculum Pattern</h3>
        <button class="btn btn-secondary btn-sm btn-icon" onclick="Modal.close()"><span data-icon="close"></span></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" style="display:flex;justify-content:space-between;align-items:center;">
            <span>Select College / Institution Preset</span>
            <span class="badge badge-success" style="font-size:10px;">Auto-detects University & Outcomes</span>
          </label>
          <select class="form-select" id="p-college" onchange="onCollegePresetChange(this.value)">
            <option value="mitaoe" selected>MIT Academy of Engineering (MITAOE), Alandi, Pune</option>
            <option value="sppu">Savitribai Phule Pune University (SPPU) — Affiliated Colleges</option>
            <option value="coep">COEP Technological University (COEP Tech)</option>
            <option value="vit">Vishwakarma Institute of Technology (VIT Pune)</option>
            <option value="nba_aicte">Universal AICTE / NBA Standard (Tier-I / Tier-II)</option>
            <option value="custom">Custom / Other Institution</option>
          </select>
        </div>

        <div id="p-univ-badge" style="background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.25);border-radius:var(--r-sm);padding:12px;margin-bottom:16px;">
          <div style="font-weight:700;color:var(--primary);font-size:13px;display:flex;align-items:center;gap:6px;">
            <span>🏛️ Affiliated University:</span>
            <span id="p-univ-name">Savitribai Phule Pune University (SPPU)</span>
          </div>
          <div style="font-size:11.5px;color:var(--text-primary);font-weight:600;margin-top:2px;" id="p-univ-status">
            Autonomous Engineering Institute (UGC Autonomous / NBA Accredited)
          </div>
          <div style="color:var(--text-secondary);font-size:11px;margin-top:4px;" id="p-univ-desc">
            Autonomous curriculum framework aligned with NEP 2020 & SPPU degree accreditation.
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" style="display:flex;justify-content:space-between;align-items:center;">
            <span>Curriculum Framework / Scheme</span>
            <span class="badge badge-primary font-mono" style="font-size:10px;">NEP 2024 vs 2019</span>
          </label>
          <select class="form-select" id="p-framework" onchange="onFrameworkChange(this.value)">
            <option value="nep2024" selected>Latest 2024 NEP Pattern (NBA GAPC v4.0 — 11 Program Outcomes)</option>
            <option value="legacy2019">2019 Pattern (NBA Legacy Standard — 12 Program Outcomes)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Pattern Name *</label>
          <input class="form-input" id="p-name" value="2024 NEP Pattern (MITAOE Autonomous)">
        </div>
        <div class="form-group">

          <input class="form-input" id="p-year" value="2024">
        </div>

          <select class="form-select" id="p-dept">

          </select>
        </div>

        <div style="background:var(--surface-2);padding:10px 14px;border-radius:var(--r-sm);border:1px solid var(--border);margin-top:12px;">
          <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text-primary);margin:0;">
            <input type="checkbox" id="p-autoload-pos" checked style="margin-top:3px;">
            <div>
              <div id="p-autoload-label">Auto-load 11 Official NBA GAPC v4.0 Outcomes (PO1 to PO11) + PSOs</div>
              <div style="font-size:11px;font-weight:400;color:var(--text-secondary);margin-top:2px;">
                Automatically populates full official descriptions aligned with Washington Accord & NBA accreditation criteria.

            </div>

        </div>
      </div>
      <div class="modal-footer">

    renderAllIcons();

  async function savePattern() {
    const name = document.getElementById('p-name').value.trim();
    const year = document.getElementById('p-year').value.trim();
    const dept = document.getElementById('p-dept').value || null;
    const autoLoad = document.getElementById('p-autoload-pos') ? document.getElementById('p-autoload-pos').checked : true;
    const collegePreset = document.getElementById('p-college') ? document.getElementById('p-college').value : 'mitaoe';
    const framework = document.getElementById('p-framework') ? document.getElementById('p-framework').value : 'nep2024';

    if (!name || !year) { Toast.error('Name and Year are required.'); return; }

    const btn = event.currentTarget;
    btn.disabled = true;
    btn.innerHTML = 'Creating Pattern & Outcomes...';

    try {
      const res = await window.apiFetch('/api/patterns', {
        method: 'POST',
        body: { name, year, departmentId: dept }
      });
      const patternId = res.id;

      if (autoLoad && patternId) {
        const preset = INSTITUTION_PRESETS[collegePreset] || INSTITUTION_PRESETS.mitaoe;
        const targetPos = (framework === 'nep2024') ? preset.pos11 : preset.pos12;
        const allOutcomes = [
          ...targetPos.map(o => ({ code: o.code, description: o.description, type: 'PO', departmentId: dept, patternId })),
          ...preset.psos.map(o => ({ code: o.code, description: o.description, type: 'PSO', departmentId: dept, patternId }))
        ];

        try {
          await window.apiFetch('/api/outcomes/bulk', {
            method: 'POST',
            body: { patternId, outcomes: allOutcomes }
          });
        } catch(bulkErr) {
          for (const o of allOutcomes) {
            try { await window.apiFetch('/api/outcomes', { method: 'POST', body: o }); } catch(err) {}
          }
        }

        const currentOutcomes = JSON.parse(localStorage.getItem('obe_outcomes') || '[]');
        const updated = [...currentOutcomes.filter(x => x.patternId !== patternId), ...allOutcomes];
        localStorage.setItem('obe_outcomes', JSON.stringify(updated));
      }

      Toast.success('Curriculum pattern created with official outcomes.');
      Modal.close();

      const patterns = await window.apiFetch('/api/patterns').catch(() => null);
      if (patterns) localStorage.setItem('obe_patterns', JSON.stringify(patterns));
      const freshOutcomes = await window.apiFetch('/api/outcomes').catch(() => null);
      if (freshOutcomes) localStorage.setItem('obe_outcomes', JSON.stringify(freshOutcomes));
      
      renderPatterns();
    } catch(e) {
      Toast.error('Failed to create pattern: ' + e.message);
      btn.disabled = false;
      btn.innerHTML = 'Create Pattern';
    }
  }

  window.currentPatternId = null;

  async function autoLoadOfficialPOs(pid) {
    const p = DB.patterns.all().find(x => x.id === pid);
    const dept = p ? p.departmentId : null;
    const isNep2024 = p && (String(p.year) >= '2024' || (p.name && p.name.includes('2024')));
    const preset = INSTITUTION_PRESETS.mitaoe;
    const targetPos = isNep2024 ? preset.pos11 : preset.pos12;
    const count = isNep2024 ? 11 : 12;

    if (!confirm(`Auto-load all ${count} official NBA / SPPU Program Outcomes and PSOs into this pattern?`)) return;

    const allOutcomes = [
      ...targetPos.map(o => ({ code: o.code, description: o.description, type: 'PO', departmentId: dept, patternId: pid })),
      ...preset.psos.map(o => ({ code: o.code, description: o.description, type: 'PSO', departmentId: dept, patternId: pid }))
    ];

    try {
      await window.apiFetch('/api/outcomes/bulk', {
        method: 'POST',
        body: { patternId: pid, outcomes: allOutcomes }
      });
    } catch(e) {
      for (const o of allOutcomes) {
        try { await window.apiFetch('/api/outcomes', { method: 'POST', body: o }); } catch(err) {}
      }
    }

    const currentOutcomes = JSON.parse(localStorage.getItem('obe_outcomes') || '[]');
    const updated = [...currentOutcomes.filter(x => x.patternId !== pid), ...allOutcomes];
    localStorage.setItem('obe_outcomes', JSON.stringify(updated));
    
    Toast.success(`Official ${count} SPPU / NBA outcomes loaded successfully.`);
    openManageOutcomesModal(pid);
    renderPatterns();
  }

  function openManageOutcomesModal(pid) {
    window.currentPatternId = pid;
    const p = DB.patterns.all().find(x => x.id === pid);
    const outcomes = DB.outcomes.all().filter(o => o.patternId === pid);
    
    const pos = outcomes.filter(o => o.type === 'PO').sort((a,b) => a.code.localeCompare(b.code, undefined, {numeric: true}));
    const psos = outcomes.filter(o => o.type === 'PSO').sort((a,b) => a.code.localeCompare(b.code, undefined, {numeric: true}));

    const isNep2024 = p && (String(p.year) >= '2024' || (p.name && p.name.includes('2024')));

    const html = `
      <div class="modal-header">
        <div>
          <h3 class="modal-title">Manage Outcomes (${p ? p.name : 'Pattern'})</h3>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">Savitribai Phule Pune University (SPPU) / NBA Aligned</div>
        </div>
        <button class="btn btn-secondary btn-sm btn-icon" onclick="Modal.close()"><span data-icon="close"></span></button>
      </div>
      <div class="modal-body" style="max-height:65vh;overflow-y:auto;padding-right:8px;">
        
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">
          <div>
            <h4 style="margin:0;font-size:14px;font-weight:700;">Program Outcomes (POs)</h4>
            <div style="font-size:11px;color:var(--text-secondary);">${isNep2024 ? '11 NBA GAPC v4.0 Graduate Attributes' : '12 AICTE/NBA Graduate Attributes'}</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-secondary btn-sm" onclick="autoLoadOfficialPOs('${p.id}')">
              <span data-icon="sparkles"></span><span>Auto-Load SPPU/NBA Outcomes</span>
            </button>
            <button class="btn btn-primary btn-sm" onclick="addOutcomeRow('PO')">
              <span data-icon="plus"></span><span>Add PO</span>
            </button>
          </div>
        </div>
        <table class="rpt-table" style="margin-bottom:24px;">
          <thead><tr><th style="width:90px;">Code</th><th>Description</th></tr></thead>
          <tbody id="po-tbody">
            ${pos.length ? pos.map(o => `
              <tr>
                <td><strong>${o.code}</strong></td>
                <td style="text-align:left;font-size:12px;line-height:1.4;">${o.description}</td>
              </tr>
            `).join('') : `<tr><td colspan="2" style="text-align:center;padding:24px;color:var(--text-secondary);">No POs defined. Click <strong>Auto-Load SPPU/NBA Outcomes</strong> above to load official ${isNep2024 ? 'PO1–PO11' : 'PO1–PO12'} automatically.</td></tr>`}
          </tbody>
        </table>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">
          <div>
            <h4 style="margin:0;font-size:14px;font-weight:700;">Program Specific Outcomes (PSOs)</h4>
            <div style="font-size:11px;color:var(--text-secondary);">Department Specialized Objectives</div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="addOutcomeRow('PSO')"><span data-icon="plus"></span><span>Add PSO</span></button>
        </div>
        <table class="rpt-table">
          <thead><tr><th style="width:90px;">Code</th><th>Description</th></tr></thead>
          <tbody id="pso-tbody">
            ${psos.length ? psos.map(o => `
              <tr>
                <td><strong>${o.code}</strong></td>
                <td style="text-align:left;font-size:12px;line-height:1.4;">${o.description}</td>
              </tr>
            `).join('') : '<tr><td colspan="2" style="text-align:center;padding:24px;color:var(--text-secondary);">No PSOs defined. Click <strong>Add PSO</strong> to add department-specific outcomes.</td></tr>'}
          </tbody>
        </table>
      </div>
    `;
    
    // override default width for larger modal
    Modal.open(html);
    const mbox = document.querySelector('.modal-box');
    if(mbox) {
        mbox.style.width = '750px';
        mbox.style.maxWidth = '92vw';
    }
    renderAllIcons();
  }

  function addOutcomeRow(type) {
    const tbody = document.getElementById(type.toLowerCase() + '-tbody');
    if (tbody.innerHTML.includes('No ' + type + 's defined')) tbody.innerHTML = '';
    
    const count = tbody.querySelectorAll('tr').length + 1;
    const defaultCode = type + count;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="padding:4px;"><input type="text" class="form-input" placeholder="${defaultCode}" id="new-${type}-code" value="${defaultCode}" style="font-size:12px;padding:4px 8px;"></td>
      <td style="padding:4px;display:flex;gap:4px;">
        <input type="text" class="form-input" placeholder="Outcome description..." id="new-${type}-desc" style="flex:1;font-size:12px;padding:4px 8px;">
        <button class="btn btn-primary btn-sm" onclick="saveNewOutcome('${type}', this)">Save</button>
      </td>
    `;
    tbody.appendChild(tr);
  }

  async function saveNewOutcome(type, btn) {
    const tr = btn.closest('tr');
    const code = tr.querySelector(`#new-${type}-code`).value.trim();
    const desc = tr.querySelector(`#new-${type}-desc`).value.trim();
    const pid = window.currentPatternId;

    if(!code || !desc) { Toast.error('Code and description required'); return; }

    btn.disabled = true;
    btn.textContent = '...';

    try {
      await window.apiFetch('/api/outcomes', {
        method: 'POST',
        body: { code, description: desc, type, patternId: pid }
      });
      Toast.success(type + ' added.');
      
      const outcomes = await window.apiFetch('/api/outcomes');
      localStorage.setItem('obe_outcomes', JSON.stringify(outcomes || []));
      openManageOutcomesModal(pid);
      renderPatterns();
    } catch(e) {
      Toast.error('Failed to add ' + type);
      btn.disabled = false;
      btn.textContent = 'Save';
    }
  }

  window.openAddPatternModal = openAddPatternModal;
  window.savePattern = savePattern;
  window.openManageOutcomesModal = openManageOutcomesModal;
  window.autoLoadOfficialPOs = autoLoadOfficialPOs;
  window.onCollegePresetChange = onCollegePresetChange;
  window.addOutcomeRow = addOutcomeRow;
  window.saveNewOutcome = saveNewOutcome;
})();
</script>
</body>
</html>
